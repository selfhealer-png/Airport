<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1b2a33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      iOS has no install prompt: a PWA gets there through Share > Add to Home Screen, and
      whether it then launches fullscreen or in a Safari tab depends on this tag. Safari 17
      honours the standard `mobile-web-app-capable` above, but everything before it needs the
      prefixed one, and there is no cost to keeping both.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Airfield" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Build an airport so the planes can land." />
    <link rel="icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Airfield</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span class="hud-title">Hensley Meadow</span>
        <span class="hud-group">
          <span id="hud-day" class="hud-stat hud-day">Day 1</span>
          <span id="hud-cash" class="hud-stat">&pound;0</span>
          <span id="hud-rep" class="hud-stat hud-rep">0</span>
        </span>
      </header>
      <div id="map-wrap">
        <canvas id="map" aria-label="Airport map"></canvas>
      </div>
      <footer id="drawer"></footer>
    </div>
    <div id="modal" hidden></div>
    <pre id="crash" hidden></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
